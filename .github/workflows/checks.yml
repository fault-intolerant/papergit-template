name: checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 公式写法
        run: python tools/lint.py
      - name: 检验
        # 退出码 5 表示还没有任何检验，不算失败
        run: pytest || [ $? -eq 5 ]
